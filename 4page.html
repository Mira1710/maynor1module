<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card bg-dark border-light p-4 mb-4">
                <h2 class="text-center mb-4">Проверка треугольника</h2>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="sideX" class="form-label">Сторона X:</label>
                        <input type="number" class="form-control bg-dark text-white border-light" id="sideX" step="any" min="0.1" placeholder="Введите длину стороны X">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="sideY" class="form-label">Сторона Y:</label>
                        <input type="number" class="form-control bg-dark text-white border-light" id="sideY" step="any" min="0.1" placeholder="Введите длину стороны Y">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="sideZ" class="form-label">Сторона Z:</label>
                        <input type="number" class="form-control bg-dark text-white border-light" id="sideZ" step="any" min="0.1" placeholder="Введите длину стороны Z">
                    </div>
                </div>

                <div class="text-center">
                    <button id="checkButton" class="btn btn-primary">Проверить треугольник</button>
                </div>

                <div id="result" class="result alert alert-info mt-4 text-center d-none"></div>
            </div>

            <div id="triangleVisualization" class="triangle-visualization card bg-dark border-light p-4 text-center">
                <h4 class="mb-3">Визуализация треугольника</h4>
                <div class="triangle mx-auto">
                    <div class="triangle-side" id="sideXLine"></div>
                    <div class="triangle-side" id="sideYLine"></div>
                    <div class="triangle-side" id="sideZLine"></div>

                    <div class="side-label" id="labelX"></div>
                    <div class="side-label" id="labelY"></div>
                    <div class="side-label" id="labelZ"></div>

                    <div class="right-angle" id="rightAngle"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
