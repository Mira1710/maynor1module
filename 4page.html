<div class="form-group">
    <label for="sideX">Сторона X:</label>
    <input type="number" id="sideX" step="any" min="0.1" placeholder="Введите длину стороны X">
</div>

<div class="form-group">
    <label for="sideY">Сторона Y:</label>
    <input type="number" id="sideY" step="any" min="0.1" placeholder="Введите длину стороны Y">
</div>

<div class="form-group">
    <label for="sideZ">Сторона Z:</label>
    <input type="number" id="sideZ" step="any" min="0.1" placeholder="Введите длину стороны Z">
</div>

<button id="checkButton">Проверить треугольник</button>

<div id="result" class="result"></div>

<div id="triangleVisualization" class="triangle-visualization">
    <div class="triangle">
        <div class="triangle-side" id="sideXLine"></div>
        <div class="triangle-side" id="sideYLine"></div>
        <div class="triangle-side" id="sideZLine"></div>

        <div class="side-label" id="labelX"></div>
        <div class="side-label" id="labelY"></div>
        <div class="side-label" id="labelZ"></div>

        <div class="right-angle" id="rightAngle"></div>
    </div>
</div>
</body>
